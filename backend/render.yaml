services:
  - type: web
    name: smart-study-planner-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: smart_study_planner
      - key: PORT
        value: 10000
